name = "screen-time-manager"
main = "worker/src/index.js"
compatibility_date = "2026-03-17"

routes = [
  { pattern = "api.saturnfocus.com", custom_domain = true }
]

[observability]
enabled = true
head_sampling_rate = 0.1

[vars]
WHOP_VERIFY_URL = "https://api.whop.com/api/v1/memberships"
WHOP_CHECKOUT_URL = "https://whop.com/joined/saturnfocus/products/screen-time-manager-pro/"
WHOP_PRODUCT_ID = "prod_1bS0uOo82g327"
WHOP_COMPANY_ID = "biz_EE8NPUFwUpVWma"
WHOP_ACTIVE_STATUSES = "active,trialing"
WHOP_WEBHOOK_TOLERANCE_SECONDS = "300"
TOKEN_TTL_DAYS = "7"
WHOP_EXTENSION_ID = "oflgdecdopjpkpbnncendjoeohoeomnf"
# WHOP_PLAN_ID is optional. If omitted, the Worker resolves a plan_x... from WHOP_PRODUCT_ID.
POSTHOG_HOST = "https://us.i.posthog.com"
ANALYTICS_DEBUG_LOGS = "false"
ANALYTICS_PRODUCTION_EXTENSION_IDS = "pecaajdaecdmikcgfdgldcofdebhfbgo"
ANALYTICS_INTERNAL_EXTENSION_IDS = "oflgdecdopjpkpbnncendjoeohoeomnf"

# Required secrets (set with `wrangler secret put`, never commit their values):
# WHOP_API_KEY, WHOP_WEBHOOK_SECRET, JWT_SECRET, POSTHOG_PROJECT_API_KEY

[[kv_namespaces]]
binding = "PREMIUM_STATUS"
id = "3f1cdfb28014454a8b5781979427ced7"
